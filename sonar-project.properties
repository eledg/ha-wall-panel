sonar.projectKey=eledg_ha-wall-panel
sonar.organization=eledg

sonar.sources=src
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.d.ts

sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  src/tests/**,\
  src/dev/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
