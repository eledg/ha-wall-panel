name: Bug report
description: Something does not work or looks wrong on the display.
labels: ['type:bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What went wrong
      description: What you saw, and what you expected to see instead. For example, "the heating tile says Off but the heating is on".
      placeholder: 'I saw ... but I expected ...'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps someone else can follow to see the same problem, in order, starting from the dashboard.
      placeholder: |
        1. Open the heating sheet
        2. Tap Resume
        3. Wait ten seconds
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Panel version
      description: Tap the version in the bottom right corner of the dashboard (Diagnostics), for example v2.1.1.
    validations:
      required: true
  - type: input
    id: display
    attributes:
      label: Display and browser
      description: The display model, for example Shelly Wall Display X2i, or the browser if you are testing on a computer.
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: false
  - type: textarea
    id: config
    attributes:
      label: Your config.json
      description: Entity IDs only. Remove anything private. Never paste a token.
      render: json
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
    validations:
      required: false
