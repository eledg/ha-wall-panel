name: Update pnpm

# Monthly, matching the dependabot cadence. Releases are versioned from every
# commit on main (see CONTRIBUTING.md), so keep the bumps infrequent.
on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-pnpm:
    # Needs this repository's PR_PAT_TOKEN secret, which forks do not have.
    if: github.repository == 'eledg/ha-wall-panel'
    runs-on: ubuntu-latest
    name: Update pnpm
    steps:
      - uses: actions/checkout@v7
      - uses: eledg/github-actions/update-pnpm@v1
        with:
          github-token: ${{ secrets.PR_PAT_TOKEN }}
          assignees: ${{ github.repository_owner }}
