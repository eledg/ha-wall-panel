name: CI
on:
  pull_request:
  push:
    branches:
      - main

# PRs cancel superseded runs; every commit on main gets its own uninterrupted run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: prettier
    steps:
      - uses: actions/checkout@v7
      - uses: eledg/github-actions/setup-pnpm@v1
      - run: pnpm prettier

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: lint
    steps:
      - uses: actions/checkout@v7
      - uses: eledg/github-actions/setup-pnpm@v1
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: type check
    steps:
      - uses: actions/checkout@v7
      - uses: eledg/github-actions/setup-pnpm@v1
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: test
    steps:
      - uses: actions/checkout@v7
      - uses: eledg/github-actions/setup-pnpm@v1
      - run: pnpm coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          if-no-files-found: error
          path: coverage/lcov.info

  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: sonar
    needs: [test]
    # Secrets are not available to PRs from forks, so the scan cannot run there.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage
      - uses: ./.github/actions/sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          wait-for-quality-gate: true
          fail-on-new-issues: true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: e2e
    # The image the baselines are generated in (docs/e2e.md); keep its version
    # in step with @playwright/test. A bare runner renders text slightly differently.
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: eledg/github-actions/setup-pnpm@v1
      - run: pnpm test:e2e
      # Holds the diff images on failure, and the rendered screenshots so a
      # baseline can be taken from CI (see docs/e2e.md).
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: build
    steps:
      - uses: actions/checkout@v7
      - uses: eledg/github-actions/setup-pnpm@v1
      - run: pnpm build
